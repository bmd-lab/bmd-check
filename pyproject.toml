[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmd-agent"
version = "0.1.0"
description = "Observation and diagnostic CLI for the Burton Materials Discovery Lab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "pymatgen-core>=2026.4.16,<2027",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
bmd-check = "bmd_agent.cli:main"
bmd-agent = "bmd_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bmd_agent = [
    "deployment_profiles/*.toml",
    "reference_corpus/vasp_wiki/*",
    "reference_corpus/vasp_wiki/pages/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
